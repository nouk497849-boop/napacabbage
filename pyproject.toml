[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taiwan-flight-deals-bot"
version = "0.1.0"
description = "Taiwan-origin flight deal scanner with Telegram alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "airportsdata>=20241001",
  "psycopg[binary]>=3.2.0",
  "pycountry>=24.6.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[project.scripts]
flight-deals-bot = "flight_deals_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
