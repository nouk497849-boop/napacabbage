name: Flight Deals Scanner

on:
  schedule:
    # GitHub cron uses UTC. This runs at 10:00, 13:00, 16:00, 19:00,
    # 22:00, 01:00, 04:00, and 07:00 in Asia/Taipei.
    - cron: "0 2-23/3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without sending Telegram alerts"
        required: true
        type: boolean
        default: true
      test_telegram:
        description: "Send a Telegram test message instead of scanning"
        required: true
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          KIWI_API_KEY: ${{ secrets.KIWI_API_KEY }}
          SKYSCANNER_API_KEY: ${{ secrets.SKYSCANNER_API_KEY }}
          SKYSCANNER_ENABLED: ${{ vars.SKYSCANNER_ENABLED || 'false' }}
          ORIGINS: ${{ vars.ORIGINS || 'TPE,TSA,KHH,RMQ,TNN' }}
          CURRENCY: ${{ vars.CURRENCY || 'TWD' }}
          STAY_LENGTHS: ${{ vars.STAY_LENGTHS || '3,5,7,10,14,21' }}
          CABINS: ${{ vars.CABINS || 'economy,business,first' }}
          SEARCHAPI_EXPLORE_LIMIT: ${{ vars.SEARCHAPI_EXPLORE_LIMIT || '3' }}
          SEARCHAPI_CALENDAR_LIMIT: ${{ vars.SEARCHAPI_CALENDAR_LIMIT || '6' }}
          SEARCHAPI_CALENDAR_DESTINATIONS: ${{ vars.SEARCHAPI_CALENDAR_DESTINATIONS || 'NRT,HND,KIX,ICN,HKG,BKK,SIN,KUL,MNL,SGN,DAD,HAN,DPS,CGK,SYD,MEL,LAX,SFO,YVR,SEA,HNL,LHR,CDG,FRA,AMS,IST,DXB' }}
          SEARCHAPI_CALENDAR_OUTBOUND_WINDOW_DAYS: ${{ vars.SEARCHAPI_CALENDAR_OUTBOUND_WINDOW_DAYS || '7' }}
          SEARCHAPI_CALENDAR_WINDOW_STEP_DAYS: ${{ vars.SEARCHAPI_CALENDAR_WINDOW_STEP_DAYS || '45' }}
          REQUIRE_VERIFIED_ALERTS: ${{ vars.REQUIRE_VERIFIED_ALERTS || 'false' }}
          NOTIFY_NO_DEALS: ${{ vars.NOTIFY_NO_DEALS || 'true' }}
          NO_DEAL_CANDIDATE_LIMIT: ${{ vars.NO_DEAL_CANDIDATE_LIMIT || '8' }}
          TRAVELPAYOUTS_DAILY_LIMIT: ${{ vars.TRAVELPAYOUTS_DAILY_LIMIT || '240' }}
          TRAVELPAYOUTS_MONTHLY_LIMIT: ${{ vars.TRAVELPAYOUTS_MONTHLY_LIMIT || '3000' }}
          AMADEUS_DAILY_LIMIT: ${{ vars.AMADEUS_DAILY_LIMIT || '80' }}
          AMADEUS_MONTHLY_LIMIT: ${{ vars.AMADEUS_MONTHLY_LIMIT || '1000' }}
          SEARCHAPI_DAILY_LIMIT: ${{ vars.SEARCHAPI_DAILY_LIMIT || '3' }}
          SEARCHAPI_MONTHLY_LIMIT: ${{ vars.SEARCHAPI_MONTHLY_LIMIT || '100' }}
          KIWI_DAILY_LIMIT: ${{ vars.KIWI_DAILY_LIMIT || '60' }}
          KIWI_MONTHLY_LIMIT: ${{ vars.KIWI_MONTHLY_LIMIT || '1000' }}
          SKYSCANNER_DAILY_LIMIT: ${{ vars.SKYSCANNER_DAILY_LIMIT || '0' }}
          SKYSCANNER_MONTHLY_LIMIT: ${{ vars.SKYSCANNER_MONTHLY_LIMIT || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test_telegram }}" = "true" ]; then
            python -m flight_deals_bot --test-telegram
            exit 0
          fi
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python -m flight_deals_bot $ARGS
